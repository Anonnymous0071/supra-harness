name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to build
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # musl first: the statically linked Linux artefact is the primary
          # distribution form.
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: x86_64-apple-darwin
            os: macos-13
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add target
        run: rustup target add ${{ matrix.target }}

      # The musl target links C++ statically: cc-rs needs a musl-targeting
      # g++, and musl-tools alone only ships musl-gcc (C). Prebuilt
      # musl-cross toolchains provide both; pinned by musl version.
      - name: Install build deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang ninja-build musl-tools
          if [ ! -x /opt/musl-cross/bin/x86_64-linux-musl-g++ ]; then
            mkdir -p /tmp/musl-cross
            cd /tmp/musl-cross
            curl -fsSL -O https://musl.cc/x86_64-linux-musl-cross.tgz
            curl -fsSL -O https://musl.cc/aarch64-linux-musl-cross.tgz
            sudo mkdir -p /opt/musl-cross
            sudo tar xzf x86_64-linux-musl-cross.tgz -C /opt/musl-cross --strip-components=1
            sudo tar xzf aarch64-linux-musl-cross.tgz -C /opt/musl-cross --strip-components=1
          fi
          echo "/opt/musl-cross/bin" >> "$GITHUB_PATH"
          ls /opt/musl-cross/bin 2>/dev/null || true

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build C++ libraries
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --parallel

      - name: Build release binary
        run: cargo build --locked --release --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          bash scripts/package.sh "${{ matrix.target }}"
          if [[ "${{ matrix.target }}" == *linux* ]]; then
            bash scripts/package-os.sh "${{ matrix.target }}" "${{ github.ref_name }}"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: supra-${{ matrix.target }}
          path: dist/*

  publish:
    name: publish
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      # Signing key is configured per-repository; the step is skipped rather
      # than failing when the secret is absent, so a fork can still build.
      - name: Sign
        if: ${{ env.MINISIGN_KEY != '' }}
        env:
          MINISIGN_KEY: ${{ secrets.MINISIGN_KEY }}
        run: bash scripts/sign-release.sh dist

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          body: |
            ## Install

            ```sh
            curl -fsSL https://raw.githubusercontent.com/Anonnymous0071/supra-harness/main/scripts/install.sh | bash
            ```

            Or grab the artefact for your platform below: `.tar.gz` everywhere,
            `.deb`/`.rpm` on Linux, or `brew install --formula
            https://raw.githubusercontent.com/Anonnymous0071/supra-harness/main/packaging/homebrew/supra.rb`
            (replace the `REPLACE_WITH_*` hashes with the ones in `SHA256SUMS`).
            `cargo install supra_cli` works once the crate is published.
