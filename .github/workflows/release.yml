name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to build
        required: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  preflight:
    name: validate release tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
      - id: release
        name: Validate semantic tag and package version
        shell: bash
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG"
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]] || {
            echo "release tag is not semantic: $tag" >&2
            exit 1
          }
          version=$(sed -n '/^\[workspace\.package\]/,/^\[/s/^version = "\([^"]*\)"/\1/p' Cargo.toml)
          [[ "$tag" == "v$version" ]] || {
            echo "release tag $tag does not match workspace version v$version" >&2
            exit 1
          }
          [[ "$(git describe --tags --exact-match HEAD)" == "$tag" ]] || {
            echo "checked-out commit is not tagged $tag" >&2
            exit 1
          }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  gate:
    name: require complete CI
    needs: preflight
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.preflight.outputs.sha }}

  build:
    name: ${{ matrix.target }}
    needs: [preflight, gate]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # gnu x86_64 (native on ubuntu-latest) rather than musl: the musl
          # target needed a prebuilt toolchain from the external musl.cc host,
          # which has timed out from runners. gnu links against glibc, which is
          # present on every major Linux distribution.
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          # x86_64 macOS is cross-built on the (more available) ARM runner with
          # Apple's x86_64 cross-clang, rather than waiting on scarce macos-13.
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.preflight.outputs.tag }}

      - name: Add target
        run: rustup target add ${{ matrix.target }}

      # x86_64-unknown-linux-gnu is native on ubuntu-latest (host g++, no
      # external toolchain). Only the aarch64 gnu target needs a cross g++.
      - name: Install build deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang ninja-build
          if [[ "${{ matrix.target }}" == "aarch64-unknown-linux-gnu" ]]; then
            sudo apt-get install -y g++-aarch64-linux-gnu
            echo "CXX_aarch64_unknown_linux_gnu=aarch64-linux-gnu-g++" >> "$GITHUB_ENV"
          fi

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: ${{ matrix.target }}

      - name: Build C++ libraries
        if: >-
          matrix.target != 'x86_64-unknown-linux-gnu' &&
          matrix.target != 'aarch64-unknown-linux-gnu'
        env:
          SUPRA_CPP: ${{ matrix.target == 'x86_64-apple-darwin' && 'x86_64-apple-clang' || '' }}
          SUPRA_CXX: ${{ matrix.target == 'x86_64-apple-darwin' && 'x86_64-apple-clang++' || '' }}
        run: |
          if [[ -n "$SUPRA_CXX" ]]; then
            cmake -S . -B build -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_C_COMPILER="$SUPRA_CPP" -DCMAKE_CXX_COMPILER="$SUPRA_CXX"
          else
            cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          fi
          cmake --build build --parallel

      - name: Build release binary
        run: cargo build --locked --release --target ${{ matrix.target }}

      - name: Smoke native release binary
        if: >-
          (runner.os == 'Windows' && matrix.target == 'x86_64-pc-windows-msvc') ||
          (runner.os == 'macOS' && matrix.target == 'x86_64-apple-darwin') ||
          (runner.os == 'macOS' && matrix.target == 'aarch64-apple-darwin')
        shell: bash
        run: |
          binary="target/${{ matrix.target }}/release/supra"
          [[ "${{ runner.os }}" == "Windows" ]] && binary="${binary}.exe"
          "$binary" --version
          "$binary" --help >/dev/null

      - name: Package
        shell: bash
        run: |
          export SOURCE_DATE_EPOCH="$(git show -s --format=%ct '${{ needs.preflight.outputs.tag }}')"
          # Per-target signed archive only; OS packages (.deb/.rpm) are not
          # shipped - install.sh installs from the verified .tar.gz.
          bash scripts/package.sh "${{ matrix.target }}" "${{ needs.preflight.outputs.tag }}"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: supra-${{ matrix.target }}
          path: dist/*

  publish:
    name: publish
    needs: [preflight, gate, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.preflight.outputs.tag }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - name: Install Minisign
        shell: bash
        run: |
          version=0.12
          sha256=9a599b48ba6eb7b1e80f12f36b94ceca7c00b7a5173c95c3efc88d9822957e73
          archive="$RUNNER_TEMP/minisign.tar.gz"
          curl -fsSLo "$archive" "https://github.com/jedisct1/minisign/releases/download/${version}/minisign-${version}-linux.tar.gz"
          echo "$sha256  $archive" | sha256sum -c -
          tar xzf "$archive" -C "$RUNNER_TEMP" --no-same-owner
          install -m 755 "$RUNNER_TEMP/minisign-linux/x86_64/minisign" "$RUNNER_TEMP/minisign"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Sign
        env:
          MINISIGN_KEY: ${{ runner.temp }}/supra.minisign.key
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
          SIGNING_KEY: ${{ secrets.MINISIGN_KEY }}
        shell: bash
        run: |
          umask 077
          printf '%s\n' "$SIGNING_KEY" > "$MINISIGN_KEY"
          bash scripts/sign-release.sh dist
          shopt -s nullglob
          manifests=(dist/supra-*.manifest.json)
          [[ ${#manifests[@]} -gt 0 ]] || { echo "release produced no update manifests" >&2; exit 1; }
          for manifest in "${manifests[@]}"; do
            [[ -f "${manifest}.minisig" ]] || { echo "unsigned update manifest: $manifest" >&2; exit 1; }
          done

      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/supra.minisign.key"

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ needs.preflight.outputs.tag }}
          files: dist/*
          generate_release_notes: true
          body: |
            ## Install

            ```sh
            curl -fsSL "https://raw.githubusercontent.com/Anonnymous0071/supra-harness/${{ needs.preflight.outputs.tag }}/scripts/install.sh" | SUPRA_VERSION="${{ needs.preflight.outputs.tag }}" SUPRA_PUBKEY='<published minisign public key>' bash
            ```

            Or grab the per-target `.tar.gz`, matching `.manifest.json`, and
            `.manifest.json.minisig`; the required signature binds the exact archive
            and its sole executable member. The Homebrew formula is published
            separately after its version and SHA-256 values have been updated from
            `SHA256SUMS`. Build from source with the tag-pinned checkout
            instructions in the README.
