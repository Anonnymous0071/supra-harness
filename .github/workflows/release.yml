name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to build
        required: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  preflight:
    name: validate release tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
      - id: release
        name: Validate semantic tag and package version
        shell: bash
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG"
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]] || {
            echo "release tag is not semantic: $tag" >&2
            exit 1
          }
          version=$(sed -n '/^\[workspace\.package\]/,/^\[/s/^version = "\([^"]*\)"/\1/p' Cargo.toml)
          [[ "$tag" == "v$version" ]] || {
            echo "release tag $tag does not match workspace version v$version" >&2
            exit 1
          }
          [[ "$(git describe --tags --exact-match HEAD)" == "$tag" ]] || {
            echo "checked-out commit is not tagged $tag" >&2
            exit 1
          }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  gate:
    name: require complete CI
    needs: preflight
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.preflight.outputs.sha }}

  build:
    name: ${{ matrix.target }}
    needs: [preflight, gate]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # musl first: the statically linked Linux artefact is the primary
          # distribution form.
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: x86_64-apple-darwin
            os: macos-13
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.preflight.outputs.tag }}

      - name: Add target
        run: rustup target add ${{ matrix.target }}

      # The musl target links C++ statically: cc-rs needs a musl-targeting
      # g++, and musl-tools alone only ships musl-gcc (C). The prebuilt
      # toolchain is accepted only at the reviewed SHA-256 digest.
      - name: Install build deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang ninja-build musl-tools rpm
          if [[ "${{ matrix.target }}" == "x86_64-unknown-linux-musl" ]]; then
            archive=x86_64-linux-musl-cross.tgz
            sha256=c5d410d9f82a4f24c549fe5d24f988f85b2679b452413a9f7e5f7b956f2fe7ea
            mkdir -p /tmp/musl-cross
            cd /tmp/musl-cross
            curl -fsSLo "$archive" "https://musl.cc/$archive"
            echo "$sha256  $archive" | sha256sum -c -
            sudo mkdir -p /opt/musl-cross
            sudo tar xzf "$archive" -C /opt/musl-cross --strip-components=1
            echo "/opt/musl-cross/bin" >> "$GITHUB_PATH"
            echo "CXX_x86_64_unknown_linux_musl=x86_64-linux-musl-g++" >> "$GITHUB_ENV"
          elif [[ "${{ matrix.target }}" == "aarch64-unknown-linux-gnu" ]]; then
            sudo apt-get install -y g++-aarch64-linux-gnu
            echo "CXX_aarch64_unknown_linux_gnu=aarch64-linux-gnu-g++" >> "$GITHUB_ENV"
          fi

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: ${{ matrix.target }}

      - name: Build C++ libraries
        if: >-
          matrix.target != 'x86_64-unknown-linux-musl' &&
          matrix.target != 'aarch64-unknown-linux-gnu'
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --parallel

      - name: Build release binary
        run: cargo build --locked --release --target ${{ matrix.target }}

      - name: Smoke native release binary
        if: >-
          (runner.os == 'Windows' && matrix.target == 'x86_64-pc-windows-msvc') ||
          (runner.os == 'macOS' && matrix.target == 'x86_64-apple-darwin') ||
          (runner.os == 'macOS' && matrix.target == 'aarch64-apple-darwin')
        shell: bash
        run: |
          binary="target/${{ matrix.target }}/release/supra"
          [[ "${{ runner.os }}" == "Windows" ]] && binary="${binary}.exe"
          "$binary" --version
          "$binary" --help >/dev/null

      - name: Package
        shell: bash
        run: |
          export SOURCE_DATE_EPOCH="$(git show -s --format=%ct '${{ needs.preflight.outputs.tag }}')"
          bash scripts/package.sh "${{ matrix.target }}"
          if [[ "${{ matrix.target }}" == *linux* ]]; then
            bash scripts/package-os.sh "${{ matrix.target }}" "${{ needs.preflight.outputs.tag }}"
          fi

      - name: Validate native Linux packages
        if: runner.os == 'Linux'
        shell: bash
        run: |
          dpkg-deb --info dist/*.deb >/dev/null
          dpkg-deb --contents dist/*.deb | grep -q './usr/bin/supra$'
          dpkg-deb --contents dist/*.deb | grep -q './usr/share/doc/supra/changelog.gz$'
          dpkg-deb --contents dist/*.deb | grep -q './usr/share/doc/supra/copyright$'
          rpmdb="$RUNNER_TEMP/supra-rpmdb"
          mkdir -p "$rpmdb"
          rpm --dbpath "$rpmdb" --initdb
          rpm --dbpath "$rpmdb" --checksig dist/*.rpm
          rpm --dbpath "$rpmdb" -qip dist/*.rpm >/dev/null
          rpm --dbpath "$rpmdb" -qlp dist/*.rpm | grep -qx '/usr/bin/supra'
          rpm --dbpath "$rpmdb" -qlp dist/*.rpm | grep -qx '/usr/share/doc/supra/CHANGELOG.md'
          rpm --dbpath "$rpmdb" -qlp dist/*.rpm | grep -qx '/usr/share/licenses/supra/LICENSE-APACHE'

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: supra-${{ matrix.target }}
          path: dist/*

  publish:
    name: publish
    needs: [preflight, gate, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.preflight.outputs.tag }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - name: Install Minisign
        shell: bash
        run: |
          version=0.12
          sha256=9a599b48ba6eb7b1e80f12f36b94ceca7c00b7a5173c95c3efc88d9822957e73
          archive="$RUNNER_TEMP/minisign.tar.gz"
          curl -fsSLo "$archive" "https://github.com/jedisct1/minisign/releases/download/${version}/minisign-${version}-linux.tar.gz"
          echo "$sha256  $archive" | sha256sum -c -
          tar xzf "$archive" -C "$RUNNER_TEMP" --no-same-owner
          install -m 755 "$RUNNER_TEMP/minisign-linux/x86_64/minisign" "$RUNNER_TEMP/minisign"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Sign
        env:
          MINISIGN_KEY: ${{ runner.temp }}/supra.minisign.key
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
          SIGNING_KEY: ${{ secrets.MINISIGN_KEY }}
        shell: bash
        run: |
          umask 077
          printf '%s\n' "$SIGNING_KEY" > "$MINISIGN_KEY"
          bash scripts/sign-release.sh dist

      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/supra.minisign.key"

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ needs.preflight.outputs.tag }}
          files: dist/*
          generate_release_notes: true
          body: |
            ## Install

            ```sh
            curl -fsSL "https://raw.githubusercontent.com/Anonnymous0071/supra-harness/${{ needs.preflight.outputs.tag }}/scripts/install.sh" | SUPRA_VERSION="${{ needs.preflight.outputs.tag }}" SUPRA_PUBKEY='<published minisign public key>' bash
            ```

            Or grab the artefact for your platform below: `.tar.gz` everywhere,
            `.deb`/`.rpm` on Linux. The Homebrew formula is published separately
            after its version and SHA-256 values have been updated from `SHA256SUMS`.
            Build from source with the tag-pinned checkout instructions in the README.
