# Pinned so every contributor and CI runner compiles with the same rustc.
# Bumping this is a deliberate, reviewable change.
[toolchain]
channel = "1.96.0"
components = ["rustfmt", "clippy", "llvm-tools", "rust-src"]
targets = [
    # Host.
    "x86_64-unknown-linux-gnu",
    # T20 agent components use the component-model target exercised by the build gate.
    "wasm32-wasip2",
]
profile = "minimal"
