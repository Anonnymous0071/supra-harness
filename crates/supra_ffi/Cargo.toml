[package]
name = "supra_ffi"
description = "Safe Rust bindings to the supra-harness C++20 libraries"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

# The C++ sources and headers are inputs to the build, and CMake caches the tree
# under OUT_DIR. Listing them keeps a `cargo package` self-contained and makes
# rebuild tracking explicit rather than relying on build.rs guessing.
include = [
    "src/**/*.rs",
    "build.rs",
    "abi_sizes.rs",
    "abi_check.cpp",
    "../../cpp/**/*.cpp",
    "../../cpp/**/*.hpp",
    "../../cpp/**/*.h",
    "../../cpp/**/CMakeLists.txt",
    "../../cpp/**/data/**",
    "../../cmake/**",
    "../../CMakeLists.txt",
]

[lints]
workspace = true

[dependencies]
libc = { workspace = true }

[build-dependencies]
cmake = "0.1.58"
cc = "1.4.4"
