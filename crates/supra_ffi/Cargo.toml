[package]
name = "supra_ffi"
description = "Safe Rust bindings to the supra-harness C++20 libraries"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

# The C++ sources and headers are inputs to the build. Owning the native tree
# inside this crate keeps registry packages self-contained and gives the root
# CMake build and Cargo one canonical source tree.
include = [
    "src/**/*.rs",
    "build.rs",
    "abi_sizes.rs",
    "abi_check.cpp",
    "native/**",
]

[lints]
workspace = true

[dependencies]
libc = { workspace = true }

[build-dependencies]
cmake = "0.1.58"
cc = "1.4.4"
