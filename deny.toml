# cargo-deny: supply-chain gate. Run via `just deny` and in CI.
# https://embarkstudios.github.io/cargo-deny/

[graph]
targets = [
    "x86_64-unknown-linux-gnu",
    "x86_64-unknown-linux-musl",
    "aarch64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
    "x86_64-pc-windows-msvc",
    "wasm32-wasip2",
]
all-features = false

[advisories]
version = 2
yanked = "deny"
# Populated only with a written justification and an expiry date.
ignore = []

[licenses]
version = 2
# Confidence floor for licence text detection; below this a human decides.
confidence-threshold = 0.93
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",
    "CC0-1.0",
    "Unlicense",
    "BSL-1.0",
    # CDLA-Permissive-2.0, scoped by the clarify entry below to webpki-root-certs'
    # CA bundle (data, not code). `allow` is the blanket grant, so the scope lives
    # in the comment and the clarify: a future non-data use of this licence would
    # need its own justification, not a free ride on this line.
    "CDLA-Permissive-2.0",
]

[[licenses.clarify]]
name = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0e_ed23 }]

# webpki-root-certs bundles Mozilla's CA certificate list, which is data licensed
# under CDLA-Permissive-2.0 - a permissive data licence in the same family as CC0: use,
# modify, and share with the licence text, no restrictions on results. It reaches the
# graph only on wasm32-wasi, through reqwest's rustls-platform-verifier on that target;
# every other target verifies against the OS store instead. The `allow` entry above is
# the grant; this clarify pins the expected licence text hash, so a changed bundle
# fails the gate rather than passing silently.
[[licenses.clarify]]
name = "webpki-root-certs"
expression = "CDLA-Permissive-2.0"
license-files = [{ path = "LICENSE", hash = 0x99b6_8c9c }]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Non-deterministic or duplicated primitives are correctness risks here:
# prefix hashing (T14) and canonical serialisation (T13) must be stable, and
# the binary-size budget leaves no room for parallel TLS or async stacks.
deny = [
    { name = "openssl-sys", reason = "rustls only; avoids a system OpenSSL dependency in the static binary" },
    { name = "openssl", reason = "rustls only" },
    { name = "native-tls", reason = "rustls only" },
    { name = "async-std", reason = "tokio is the single async runtime" },
]
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
