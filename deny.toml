# cargo-deny: supply-chain gate. Run via `just deny` and in CI.
# https://embarkstudios.github.io/cargo-deny/

[graph]
targets = [
    "x86_64-unknown-linux-gnu",
    "x86_64-unknown-linux-musl",
    "aarch64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
    "x86_64-pc-windows-msvc",
    "wasm32-wasip2",
]
all-features = false

[advisories]
version = 2
yanked = "deny"
# Populated only with a written justification and an expiry date.
ignore = []

[licenses]
version = 2
# Confidence floor for licence text detection; below this a human decides.
confidence-threshold = 0.93
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",
    "CC0-1.0",
    "Unlicense",
    "BSL-1.0",
]

[[licenses.clarify]]
name = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0e_ed23 }]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Non-deterministic or duplicated primitives are correctness risks here:
# prefix hashing (T14) and canonical serialisation (T13) must be stable, and
# the binary-size budget leaves no room for parallel TLS or async stacks.
deny = [
    { name = "openssl-sys", reason = "rustls only; avoids a system OpenSSL dependency in the static binary" },
    { name = "openssl", reason = "rustls only" },
    { name = "native-tls", reason = "rustls only" },
    { name = "async-std", reason = "tokio is the single async runtime" },
]
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
