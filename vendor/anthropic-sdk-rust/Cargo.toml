    "api-bindings",
    "web-programming::http-client",
    "asynchronous",
]
license = "MIT"
repository = "https://github.com/dimichgh/anthropic-sdk-rust"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = [
    "--cfg",
    "docsrs",
]
