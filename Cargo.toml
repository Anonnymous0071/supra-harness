[workspace]
resolver = "3"
members = [
    "crates/supra_ffi",
    "crates/supra_types",
    "crates/supra_config",
    "crates/supra_log",
    "crates/supra_eventbus",
    "crates/supra_store",
    "crates/supra_vector",
    "crates/supra_secrets",
    "crates/supra_guard",
    "crates/supra_llm",
    "crates/supra_prompt",
    "crates/supra_digest",
    "crates/supra_cohort",
    "crates/supra_ast",
    "crates/supra_sandbox",
    "crates/supra_shell",
    "crates/supra_journal",
    "crates/supra_permission",
    "crates/supra_tool",
    "crates/supra_mcp",
    "crates/supra_skill",
    "crates/supra_plugin",
    "crates/supra_blackboard",
    "crates/supra_introspector",
    "crates/supra_core",
    "crates/supra_lsp",
    "crates/supra_dap",
    "crates/supra_session",
    "crates/supra_hook",
    "crates/supra_telemetry",
    "crates/supra_command",
    "crates/supra_theme",
    "crates/supra_tui",
    "crates/supra_cli",
    "crates/supra_update",
    "crates/supra_eval",
    "agents/contract-smoke",
]

# ---------------------------------------------------------------------------
# Shared package metadata. Every member crate inherits these with
# `field.workspace = true` so version/licence/MSRV live in exactly one place.
# ---------------------------------------------------------------------------
[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.86"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Anonnymous0071/supra-harness"
authors = ["supra-harness contributors"]

# ---------------------------------------------------------------------------
# Dependency pinning policy
#
# Versions here carry a full major.minor.patch. Exact `=` pins are deliberately
# NOT used: several dependency families (RustCrypto digest/hmac/aes-gcm,
# rusqlite/libsqlite3-sys, wasmtime/cranelift) must agree on shared transitive
# majors, and `=` pins make that unsolvable without vendoring.
#
# Reproducibility comes from the committed Cargo.lock plus `--locked` in every
# CI invocation. Security patches stay reachable through `cargo update -p <x>`.
#
# Entries are declared ahead of the stage that consumes them so the stage map in
# docs/ARCHITECTURE.md and this table stay in sync. An unused entry costs
# nothing: Cargo only resolves a workspace dependency once a member selects it.
# ---------------------------------------------------------------------------
[workspace.dependencies]
# Internal crates.
#
# A path dependency needs an explicit `version` as well as its `path`. Without one
# Cargo records the requirement as `*`, which `cargo deny`'s wildcard ban rejects and
# which cannot be published to a registry at all. Declaring them here keeps that
# version literal in exactly one place - Cargo has no `version.workspace = true`
# inside a dependency spec, so one literal is unavoidable, and
# `scripts/check-invariants.sh` asserts it still matches `workspace.package.version`.
supra_types = { path = "crates/supra_types", version = "0.2.0" }
supra_config = { path = "crates/supra_config", version = "0.2.0" }
supra_store = { path = "crates/supra_store", version = "0.2.0" }
libc = "0.2.189"
supra_secrets = { path = "crates/supra_secrets", version = "0.2.0" }
supra_log = { path = "crates/supra_log", version = "0.2.0" }
supra_guard = { path = "crates/supra_guard", version = "0.2.0" }
supra_ffi = { path = "crates/supra_ffi", version = "0.2.0" }
supra_llm = { path = "crates/supra_llm", version = "0.2.0" }
supra_prompt = { path = "crates/supra_prompt", version = "0.2.0" }
supra_cohort = { path = "crates/supra_cohort", version = "0.2.0" }
supra_ast = { path = "crates/supra_ast", version = "0.2.0" }
supra_digest = { path = "crates/supra_digest", version = "0.2.0" }
supra_sandbox = { path = "crates/supra_sandbox", version = "0.2.0" }
supra_shell = { path = "crates/supra_shell", version = "0.2.0" }
supra_journal = { path = "crates/supra_journal", version = "0.2.0" }
supra_permission = { path = "crates/supra_permission", version = "0.2.0" }
supra_tool = { path = "crates/supra_tool", version = "0.2.0" }
supra_mcp = { path = "crates/supra_mcp", version = "0.2.0" }
supra_skill = { path = "crates/supra_skill", version = "0.2.0" }
supra_plugin = { path = "crates/supra_plugin", version = "0.2.0" }
supra_blackboard = { path = "crates/supra_blackboard", version = "0.2.0" }
supra_introspector = { path = "crates/supra_introspector", version = "0.2.0" }
supra_core = { path = "crates/supra_core", version = "0.2.0" }
supra_lsp = { path = "crates/supra_lsp", version = "0.2.0" }
supra_dap = { path = "crates/supra_dap", version = "0.2.0" }
supra_session = { path = "crates/supra_session", version = "0.2.0" }
# provider transport (T13): official OpenAI client. Anthropic Messages use
# direct canonical HTTP because Anthropic does not publish an official Rust SDK.
async-openai = { version = "0.42.0", default-features = false, features = ["full", "rustls"] }
supra_hook = { path = "crates/supra_hook", version = "0.2.0" }
supra_telemetry = { path = "crates/supra_telemetry", version = "0.2.0" }
supra_command = { path = "crates/supra_command", version = "0.2.0" }
supra_theme = { path = "crates/supra_theme", version = "0.2.0" }
supra_tui = { path = "crates/supra_tui", version = "0.2.0" }
supra_update = { path = "crates/supra_update", version = "0.2.0" }
supra_eval = { path = "crates/supra_eval", version = "0.2.0" }
supra_cli = { path = "crates/supra_cli", version = "0.2.0" }
supra_eventbus = { path = "crates/supra_eventbus", version = "0.2.0" }
supra_vector = { path = "crates/supra_vector", version = "0.2.0" }
wit-bindgen = "0.57.1"

# async runtime + streams
tokio = { version = "1.53.1", default-features = false }
tokio-util = "0.7.19"
futures = "0.3.34"
bytes = "1.12.1"

# serialisation. Canonical (sorted-key) emission is implemented in T13
# supra_llm::ser::canonical; serde_json is the substrate, not the guarantee.
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "1.1.5"

# errors
thiserror = "2.0.20"
anyhow = "1.0.104"

# diagnostics (T8)
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }

# identity + hashing (T6 Sealed<Segment>, T14 prefix hashing, T16.6 journal CAS)
ulid = "3.0.0"
blake3 = "1.8.7"

# collections with the shapes T6/T14 need
indexmap = "2.14.1"
smallvec = "1.16.0"

# storage (T10, T11)
rusqlite = { version = "0.40.2", features = ["bundled"] }

# secrets (T12). keyring 3.6.3 is the newest line supporting the workspace's Rust 1.86
# floor. Its defaults are empty, so name each native backend explicitly. The
# pure-Rust D-Bus client avoids a system libdbus build dependency; keyring calls
# remain isolated from async runtimes because its public API is synchronous.
keyring = { version = "3.6.3", default-features = false, features = [
    "async-secret-service",
    "async-io",
    "crypto-rust",
    "apple-native",
    "windows-native",
] }
aes-gcm = "0.11.1"
pbkdf2 = "0.13.0"
sha2 = "0.11.0"
zeroize = { version = "1.9.0", features = ["derive"] }
getrandom = "0.4.3"
fs2 = "=0.4.3"

# guard (T12.5): HMAC-SHA256 for the environment marker
hmac = "0.13.0"

# provider transport (T13)
reqwest = { version = "0.13.4", default-features = false, features = [
    "json",
    "rustls",
    "stream",
] }

# wasm host (T20). 36.0.14 is the first maintained release line containing all
# published component-runtime and Cranelift sandbox fixes as of 2026-09-10.
# Keep the feature set to the component runtime and Cranelift compiler used by
# supra_plugin; profiling/cache/WASI/Winch are not part of this host.
wasmtime = { version = "36.0.14", default-features = false, features = [
    "component-model",
    "cranelift",
    "runtime",
    "std",
    "wat",
] }

# code intelligence (T15, T15.7). 0.26.7 retains the current language API while
# supporting Rust 1.86; the lock file pins tree-sitter-language to 0.1.7 for the same reason.
tree-sitter = "0.26.7"
tree-sitter-rust = "0.24.2"
tree-sitter-typescript = "0.23.2"
tree-sitter-python = "0.25.0"
tree-sitter-javascript = "0.25.0"
tree-sitter-go = "0.25.0"
tree-sitter-c = "0.24.2"
tree-sitter-cpp = "0.23.4"

# filesystem watching (T15 incremental digest, T19 skill hot-reload)
notify = "8.2.0"

# cli surface (T30)
clap = { version = "4.6.6", features = ["derive", "env"] }

# updater (T30) — MIT only, no transitive OpenSSL/native-tls
minisign-verify = "0.2.5"
semver = { version = "1.0.28", features = ["serde"] }
flate2 = { version = "1.1.10", default-features = false, features = ["rust_backend"] }
tar = { version = "0.4.46", default-features = false }

# ---------------------------------------------------------------------------
# Lints applied to every member via `[lints] workspace = true`.
# ---------------------------------------------------------------------------
[workspace.lints.rust]
unsafe_code = "warn"           # T5 supra_ffi re-allows this; nowhere else may.
missing_docs = "warn"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Fail on the classes that silently corrupt a long-running agent process.
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
dbg_macro = "warn"
print_stdout = "warn"          # stdout belongs to the protocol channel.
print_stderr = "warn"          # diagnostics go through T8 supra_log.
# Non-determinism is a cache-correctness bug here, not a style question.
mutable_key_type = "deny"
# Rust 1.96 promoted this readability preference into the pedantic set. Keep nested
# conditions explicit where each layer represents a distinct validation or I/O boundary;
# it is not a correctness gate and rewriting the workspace would obscure those boundaries.
collapsible_if = "allow"

[profile.dev]
opt-level = 0
debug = true
incremental = true

[profile.test]
inherits = "dev"

# Ships as a single static binary; optimise for size and startup, not for
# build time. panic = "abort" also removes unwind tables from the binary.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
debug = false
overflow-checks = true

# Release codegen with symbols retained, for profiling the startup and
# render budgets recorded in docs/ARCHITECTURE.md.
[profile.profiling]
inherits = "release"
strip = "none"
debug = 1

[profile.bench]
inherits = "release"
lto = "thin"
codegen-units = 4
strip = "none"
debug = 1
